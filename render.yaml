services:
  - type: web
    name: mundo-das-esquadrias
    runtime: node
    region: virginia
    plan: 0.5c-512mb
    buildCommand: npm ci --build-from-source=sqlite3
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: mundo-das-esquadrias-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: DATA_DIR
        value: /opt/render/project/src/data
      - key: SESSION_SECRET
        generateValue: true
      - key: PAYMENT_PROVIDER
        value: mercadopago
      - key: MP_ENVIRONMENT
        value: test
      - key: APPLE_PAY_DOMAIN_VERIFICATION
        value: "0"
