<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        Entrar | Mundo das Esquadrias
    </title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

    <main class="auth-container">
        <a class="voltar" href="index.html">
            Voltar ao site
        </a>

        <section class="auth-card">
            <h1>
                Área do Cliente
            </h1>
            <p id="mensagem" class="mensagem" role="status" aria-live="polite"></p>
                <!-- Mensagem de erro será exibida aqui -->
            <div class="auth-grid">
                <form id="form-login">
                    <h2>
                        Entrar
                    </h2>

                    <label for="identificador">
                        Email ou telefone
                    </label>
                    <input id="identificador" type="text" required>

                    <label for="senha-login">
                        Senha
                    </label>
                    <input id="senha-login" type="password" minlength="8" required>

                    <button class="btn" type="submit">
                        Entrar
                    </button>
                </form>

                <form id="form-cadastro">
                    <h2>
                        Criar Conta
                    </h2>
                    
                    <label for="nome">
                        Nome completo
                    </label>
                    <input type="text" id="nome" name="nome" required>

                    <label for="email">
                        Email
                    </label>
                    <input type="email" id="email" name="email" required>

                    <label for="telefone">
                        Telefone
                    </label>
                    <input id="telefone" type="tel" placeholder="(21) 9999-9999">

                    <label for="senha-cadastro">
                        Senha
                    </label>
                    <input id="senha-cadastro" type="password" minlength="8" required>

                    <button class="btn" type="submit">
                        Cadastrar
                    </button>
                </form>
            </div>
        </section>
    </main>

   <script src="api.js"></script>
   <script src="login.js"></script>
</body>
</html>
